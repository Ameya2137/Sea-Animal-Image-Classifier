data:
  source_dir: C:/Users/ameya/Downloads/sea_animals_dataset
  raw_dir: data/raw
  processed_dir: data/processed

image:
  image_size: 128
  channels: 3

split:
  validation_size: 0.15
  test_size: 0.15
  random_seed: 42

augmentation:
  rotation: 20
  width_shift: 0.2
  height_shift: 0.2
  zoom: 0.2
  horizontal_flip: true
  brightness: 0.1

training:
  batch_size: 32
  epochs: 15
  learning_rate: 0.001
  optimizer: adam
  dropout_rate: 0.2

model:
  dense_units_1: 256
  dense_units_2: 128

feature_selection:
  method: variance
  threshold: 0.01
  max_features: 512
